name: wf-ci
on:
 pull_request:
   branches:
   - develop
   types:
   - opened
   - synchronize
 push:
    branches:
    - develop
jobs:
 linting-job:
  runs-on: ubuntu-latest
  steps:
    - name: Welcome steps
      run: echo "Welcome to CI Pipline"
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Repo Information
      run: |
        git branch
        echo "Event Name :${{github.actor}}"
        echo "Event Name :${{github.repositary}}"
        echo "Event Name :${{github.event}}"